<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Monochrome layer, for Android 13+ themed icons. The system throws the colour
    away and keeps the alpha, so this is the same geometry in flat white with
    the screen glow dropped: a soft red wash contributes nothing but a grey haze
    once it is tinted.

    Same 0.66 safe-zone scale as adaptive-fg.svg. The two must agree, or the
    themed icon changes size when a user turns theming on.
  -->
  <defs>
    <clipPath id="aboveFrame">
      <rect x="0" y="0" width="100" height="42.4"/>
    </clipPath>
  </defs>

  <g transform="translate(50,50) scale(0.66) translate(-50,-52.9)" fill="#FFFFFF">
    <g clip-path="url(#aboveFrame)" stroke="#FFFFFF" stroke-width="5.4"
       stroke-linecap="round" fill="none">
      <path d="M50 46 L30.5 17.5"/>
      <path d="M50 46 L69.5 17.5"/>
    </g>
    <circle cx="30.5" cy="17.5" r="4.3"/>
    <circle cx="69.5" cy="17.5" r="4.3"/>
    <rect x="13.5" y="39.5" width="73" height="50" rx="11.5"
          fill="none" stroke="#FFFFFF" stroke-width="6.2"/>
    <polygon points="43.2,53.5 43.2,75.5 63.7,64.5"/>
  </g>
</svg>
