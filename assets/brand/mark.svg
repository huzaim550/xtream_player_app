<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    The Manzar mark: a set with rabbit-ear antennas and a play triangle on the
    screen. Drawn on the same 100x100 grid the old M used, so every raster
    command in README.md is unchanged.

    Two things carry the brand through from the old mark: the red is the same
    #E11D2E family, and the play triangle keeps the folded-ribbon shading, a
    bright face over a deep one, rather than being flat.
  -->
  <defs>
    <!-- The frame. Not flat white: a slight top-to-bottom fall gives the set
         some dimension at large sizes and still reads as one solid stroke at
         launcher size. -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C2CBD8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3B4E"/>
      <stop offset="100%" stop-color="#C3101F"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A50D19"/>
      <stop offset="100%" stop-color="#6E0912"/>
    </linearGradient>
    <!-- Light coming off the screen. Sits under the play triangle so the
         triangle appears lit from behind rather than pasted on. -->
    <radialGradient id="screen" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#E11D2E" stop-opacity="0.42"/>
      <stop offset="58%" stop-color="#E11D2E" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#E11D2E" stop-opacity="0"/>
    </radialGradient>
    <!--
      The frame is an open stroke, so anything drawn behind it shows through the
      screen. The antennas run past the frame's top edge and are cut off at
      42.4, which is the *inner* edge of that stroke (rect y=39.5, stroke 6.2,
      so the band is 36.4 to 42.6).

      Both halves of that matter. Stop the rods short of the frame instead and
      the V's vertex sits above it as a notch; let them run unclipped and the
      vertex hangs inside the screen as a white wedge. Ending them under the
      stroke and clipping at its inner edge is the only version with neither.
    -->
    <clipPath id="aboveFrame">
      <rect x="0" y="0" width="100" height="42.4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#aboveFrame)" stroke="url(#chrome)" stroke-width="5.4"
     stroke-linecap="round" fill="none">
    <path d="M50 46 L30.5 17.5"/>
    <path d="M50 46 L69.5 17.5"/>
  </g>
  <circle cx="30.5" cy="17.5" r="4.3" fill="url(#bar)"/>
  <circle cx="69.5" cy="17.5" r="4.3" fill="url(#bar)"/>

  <rect x="17" y="43" width="66" height="43" rx="8" fill="url(#screen)"/>
  <rect x="13.5" y="39.5" width="73" height="50" rx="11.5"
        fill="none" stroke="url(#chrome)" stroke-width="6.2"/>

  <!-- Play triangle, split along its own axis into a lit face and a folded
       one. The seam is what ties it to the old mark.

       Nudged right of the screen's true centre on purpose: a triangle's mass
       sits toward its base, so a geometrically centred one looks shifted left.
       Base x=43.2, apex x=63.7 puts the centroid on 50. -->
  <polygon points="43.2,53.5 43.2,64.5 63.7,64.5" fill="url(#bar)"/>
  <polygon points="43.2,64.5 63.7,64.5 43.2,75.5" fill="url(#fold)"/>
</svg>
